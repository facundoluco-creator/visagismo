spring.application.name=turnero-barberia

# ---- Base de datos: SQL Server ----
# Los valores se pueden pisar con variables de entorno (DB_URL, DB_USER, DB_PASSWORD)
# para no subir credenciales reales a GitHub.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=turnero_barberia;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:cambiar_password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---- JPA / Hibernate ----
# 'update' crea/ajusta las tablas a partir de las entidades (cómodo mientras se desarrolla).
# Cuando se pasen a usar migraciones con Flyway: ddl-auto=validate y spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Flyway ----
# Desactivado por ahora (las migraciones irían en src/main/resources/db/migration)
spring.flyway.enabled=false
